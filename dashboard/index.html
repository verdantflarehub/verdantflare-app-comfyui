<!doctype html>
<html lang="zh-CN"
      data-embedded="true">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ComfyUI 应用控制台</title>
  <link rel="stylesheet"
        href="./dashboard.css">
</head>

<body data-embedded="true">
  <main id="dashboard"
        class="comfyui-dashboard">
    <div class="breadcrumb-bar">
      <nav id="comfyuiBreadcrumb"
           class="breadcrumb"
           aria-label="面包屑">
        <span>ComfyUI</span>
        <span aria-hidden="true">/</span>
        <span aria-current="page">实例列表</span>
      </nav>
    </div>
    <header id="appHeader"
            class="topline studio-app-heading">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 84 84"
               fill="none"
               xmlns="http://www.w3.org/2000/svg"
               aria-hidden="true">
            <rect width="84"
                  height="84"
                  rx="18"
                  fill="#172DD7" />
            <path d="M28.5899 69.2727C27.3242 69.2727 26.303 68.8023 25.637 67.9128C24.9524 66.9989 24.774 65.723 25.1471 64.4133L26.6455 59.1518C26.765 58.7329 26.6818 58.2821 26.4212 57.9336C26.1606 57.5858 25.7529 57.381 25.3198 57.381H21.0116C19.7453 57.381 18.724 56.9112 18.0583 56.0218C17.3738 55.1072 17.1953 53.8314 17.5687 52.5216L22.7163 34.5286L23.2847 32.5517C24.0487 29.869 26.8349 27.6888 29.4966 27.6888H34.6517C35.2668 27.6888 35.8079 27.2787 35.9773 26.6835L37.6821 20.6987C38.4453 18.0187 41.2316 15.8385 43.8933 15.8385L54.9181 15.8189L62.9891 15.8182C64.2551 15.8182 65.2763 16.288 65.942 17.1774C66.6265 18.0913 66.805 19.3672 66.4319 20.6769L64.124 28.7803C63.3611 31.4595 60.5748 33.6391 57.9131 33.6391L46.8637 33.6601H41.7104C41.0959 33.6601 40.5555 34.0695 40.3851 34.6641L36.0883 49.6722C35.9681 50.0919 36.0513 50.5441 36.3126 50.8925C36.5732 51.2403 36.9809 51.445 37.4136 51.445L44.7152 51.4308H52.7622C54.0282 51.4308 55.0494 51.9006 55.7151 52.7901C56.3996 53.7046 56.5781 54.9805 56.2047 56.2902L53.8969 64.3923C53.1339 67.0722 50.3476 69.2517 47.686 69.2517L36.6369 69.2727H28.5899Z"
                  fill="#F0FF41" />
          </svg>
        </div>
        <div>
          <div class="title-line">
            <h1>ComfyUI</h1>
            <span class="badge running"><span class="dot"></span>5090 节点工作站</span>
          </div>
          <p class="subtitle">云端节点流生成工作站 · 独立工作区与 5090 算力管理</p>
        </div>
      </div>
      <div class="actions">
        <button id="refresh"
                class="btn"
                type="button">
          <svg class="icon"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6" />
          </svg>刷新
        </button>
        <button id="create"
                class="btn primary"
                type="button"
                hidden>
          <svg class="icon"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>创建实例
        </button>
      </div>
    </header>
    <div class="toolbar filterbar">
      <div id="filters"
           class="filters filter-pills"
           role="group"
           aria-label="运行状态筛选">
        <button type="button"
                class="filter filter-pill"
                data-filter="all"
                aria-pressed="true"><span>全部</span><span id="count-all"
                class="filter-count num">0</span></button>
        <button type="button"
                class="filter filter-pill"
                data-filter="running"
                aria-pressed="false"><span>运行中</span><span id="count-running"
                class="filter-count num">0</span></button>
        <button type="button"
                class="filter filter-pill"
                data-filter="stopped"
                aria-pressed="false"><span>已停止</span><span id="count-stopped"
                class="filter-count num">0</span></button>
        <button type="button"
                class="filter filter-pill"
                data-filter="failed"
                aria-pressed="false"><span>异常</span><span id="count-failed"
                class="filter-count num">0</span></button>
      </div>
      <div class="filterbar-right">
        <label class="search">
          <span class="sr-only">搜索实例</span>
          <svg class="icon"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.7"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="10"
                    cy="10"
                    r="6" />
            <path d="m15 15 5 5" />
          </svg>
          <input id="search"
                 type="search"
                 placeholder="搜索实例名称、ID 或工作流"
                 autocomplete="off">
        </label>
      </div>
    </div>
    <p id="message"
       class="status-banner"
       role="status"
       aria-live="polite"
       hidden>正在加载实例…</p>
    <div id="instances"
         aria-label="实例列表"></div>

    <dialog id="create-dialog"
            class="dialog"
            aria-labelledby="create-dialog-title">
      <form id="create-form">
        <h2 id="create-dialog-title">创建 ComfyUI 实例</h2>
        <p class="dialog-desc">基础 CPU 环境。创建后处于「未启动」状态，不提前占用计算资源；需要时在列表中点击「启动」即可打开官方编辑器。</p>
        <label class="field">
          <span>实例名称</span>
          <input id="create-name"
                 required
                 maxlength="80"
                 autocomplete="off"
                 placeholder="例如：ComfyUI 环境 01">
        </label>
        <div class="field">
          <span>初始工作流（可选）</span>
          <div class="workflow-picker">
            <span id="workflow-name">使用空白工作流</span>
            <div class="workflow-actions">
              <button id="workflow-select"
                      class="btn sm"
                      type="button">选择 JSON 工作流</button>
              <button id="workflow-clear"
                      class="btn sm"
                      type="button"
                      hidden>移除</button>
            </div>
          </div>
        </div>
        <p id="create-message"
           class="dialog-message"
           role="status"
           aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="create-cancel"
                  class="btn"
                  type="button">取消</button>
          <button id="create-submit"
                  class="btn primary"
                  type="submit">创建实例</button>
        </div>
      </form>
    </dialog>

    <dialog id="stop-dialog"
            class="dialog"
            aria-labelledby="stop-dialog-title">
      <h2 id="stop-dialog-title">停止实例？</h2>
      <p id="stop-dialog-desc"
         class="dialog-desc">将停止运行容器并释放计算资源，实例草稿和工作卷保留。</p>
      <div class="dialog-actions">
        <button id="stop-cancel"
                class="btn"
                type="button">取消</button>
        <button id="stop-confirm"
                class="btn primary"
                type="button">确认停止</button>
      </div>
    </dialog>

    <dialog id="destroy-dialog"
            class="dialog"
            aria-labelledby="destroy-dialog-title">
      <h2 id="destroy-dialog-title">销毁实例？</h2>
      <p id="destroy-dialog-desc"
         class="dialog-desc">销毁后该实例将从列表移除；已绑定的工作卷保留，由存储管理独立释放。</p>
      <label class="field">
        <span>输入实例名称确认</span>
        <input id="destroy-name"
               autocomplete="off"
               placeholder="">
      </label>
      <div class="dialog-actions">
        <button id="destroy-cancel"
                class="btn"
                type="button">取消</button>
        <button id="destroy-confirm"
                class="btn danger"
                type="button"
                disabled>确认销毁</button>
      </div>
    </dialog>
  </main>
  <script type="module"
          src="./dashboard.mjs"></script>
</body>

</html>
