name: ComfyUI
on:
  push:
    branches: [release]
permissions:
  contents: read
concurrency:
  group: comfyui-release
  cancel-in-progress: false
env:
  REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
  IMAGE_NAME: wod/verdantflare-app
  VERSION: 0.1.7
jobs:
  image:
    name: Build and publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: comfyui
            dockerfile: Dockerfile
            build_args: ""
          - component: comfyui-worker-cpu
            dockerfile: Dockerfile.worker
            build_args: |
              RUNTIME_REQUIREMENTS=requirements-runtime-cpu.lock
              COMFYUI_DEVICE=cpu
          - component: comfyui-worker
            dockerfile: Dockerfile.worker
            build_args: |
              RUNTIME_REQUIREMENTS=requirements-runtime.lock
              COMFYUI_DEVICE=cuda
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure release destination
        id: image
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || exit 1
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "tag=$endpoint/$IMAGE_NAME:${{ matrix.component }}-v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing release tag
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/check-image-absent.sh
      - name: Build and publish versioned image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            ${{ matrix.build_args }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
          sbom: false
      - name: Extract Dashboard materials from the published image digest
        if: matrix.component == 'comfyui'
        env:
          APP_IMAGE: ${{ steps.image.outputs.tag }}
          APP_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          image_ref="${APP_IMAGE%:*}@${APP_IMAGE_DIGEST}"
          docker pull "$image_ref"
          release_container="$(docker create "$image_ref")"
          trap 'docker rm "$release_container" >/dev/null' EXIT
          mkdir -p build/dashboard-release
          docker cp "$release_container:/opt/vf/build/dashboard" build/dashboard-release/dashboard
          docker cp "$release_container:/opt/vf/build/frontend/workspace-index.json" build/dashboard-release/workspace-index.json
          docker cp "$release_container:/opt/vf/VERSION" build/dashboard-release/VERSION
          docker cp "$release_container:/opt/vf/management-release.json" build/dashboard-release/management-release.json
      - name: Write immutable release material index
        if: matrix.component == 'comfyui'
        env:
          APP_IMAGE: ${{ steps.image.outputs.tag }}
          APP_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: python3 scripts/prepare_release.py --bundle build/dashboard-release
      - name: Upload Dashboard release materials
        if: matrix.component == 'comfyui'
        uses: actions/upload-artifact@v4
        with:
          name: comfyui-dashboard-v${{ env.VERSION }}
          path: build/dashboard-release/
          if-no-files-found: error
          retention-days: 30
